<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Life Logger (Media Storage Edition)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --bg-mesh: radial-gradient(at 40% 20%, hsla(28,100%,74%,0.2) 0px, transparent 50%),
                       radial-gradient(at 80% 0%, hsla(189,100%,56%,0.2) 0px, transparent 50%),
                       radial-gradient(at 0% 50%, hsla(355,100%,93%,0.2) 0px, transparent 50%);
            --bg-color: #f5f5f7;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ED;
            --success: #34c759;
            --error: #ff3b30;
            --radius-lg: 24px;
            --radius-md: 16px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        [data-theme="dark"] {
            --bg-mesh: radial-gradient(at 40% 20%, hsla(28,100%,74%,0.1) 0px, transparent 50%),
                       radial-gradient(at 80% 0%, hsla(189,100%,56%,0.1) 0px, transparent 50%),
                       radial-gradient(at 0% 50%, hsla(355,100%,93%,0.1) 0px, transparent 50%);
            --bg-color: #000000;
            --glass-bg: rgba(30, 30, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --text-primary: #f5f5f7;
            --text-secondary: #a1a1a6;
            --accent: #2997ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            background-image: var(--bg-mesh);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            transition: var(--transition);
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
        }

        .container {
            width: 100%;
            max-width: 1400px;
            padding: 2rem;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Sidebar */
        .sidebar { display: flex; flex-direction: column; gap: 1.5rem; }
        .header-card { padding: 2rem; text-align: center; }
        .greeting { font-size: 1.1rem; color: var(--text-secondary); font-weight: 500; }
        .date-display { font-size: 1.8rem; font-weight: 700; margin: 0.5rem 0; letter-spacing: -0.5px; }
        .clock { font-size: 3rem; font-weight: 300; font-variant-numeric: tabular-nums; }

        /* Calendar Widget */
        .calendar-card { padding: 1.5rem; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-weight: 600;}
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; text-align: center; }
        .day-name { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; padding-bottom: 0.5rem;}
        .calendar-day {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; border-radius: 50%; cursor: pointer; transition: var(--transition);
        }
        .calendar-day:hover { background: rgba(0,0,0,0.05); }
        [data-theme="dark"] .calendar-day:hover { background: rgba(255,255,255,0.1); }
        .calendar-day.today { background: var(--accent); color: white; font-weight: 600; box-shadow: 0 4px 12px rgba(0,113,227,0.3); }
        .calendar-day.has-entry::after {
            content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px;
            background: var(--success); border-radius: 50%;
        }

        /* Main Content */
        .main-content { display: flex; flex-direction: column; gap: 1.5rem; height: calc(100vh - 4rem); }
        .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; border-radius: var(--radius-md); }
        .tools { display: flex; gap: 1rem; }
        
        button {
            background: transparent; border: none; color: var(--text-primary); cursor: pointer;
            padding: 0.5rem 1rem; border-radius: 8px; font-weight: 500; font-size: 0.9rem;
            display: flex; align-items: center; gap: 0.5rem; transition: var(--transition);
        }
        button:hover { background: rgba(128,128,128,0.1); }
        button.primary { background: var(--accent); color: white; }
        button.primary:hover { background: var(--accent-hover); }
        button.danger { background: var(--error); color: white; }
        button.danger:hover { background: #d32f2f; }

        /* Editor */
        .editor-card { flex: 1; display: flex; flex-direction: column; padding: 0; overflow: hidden; position: relative; }
        textarea {
            flex: 1; width: 100%; resize: none; border: none; background: transparent;
            padding: 2rem; font-family: var(--font-family); font-size: 1.1rem; line-height: 1.7;
            color: var(--text-primary); outline: none;
        }
        textarea::placeholder { color: var(--text-secondary); opacity: 0.6; }
        
        .status-bar { padding: 1rem 2rem; border-top: 1px solid var(--glass-border); display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-secondary); }
        .status-indicator { display: flex; align-items: center; gap: 0.5rem; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-secondary); }
        .dot.syncing { background: var(--accent); animation: pulse 1s infinite alternate; }
        .dot.saved { background: var(--success); }

        @keyframes pulse { from { opacity: 0.5; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }

        /* Media Upload Area */
        .media-drawer { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .media-dropzone {
            border: 2px dashed var(--glass-border); border-radius: var(--radius-md); padding: 1.5rem;
            text-align: center; color: var(--text-secondary); cursor: pointer; transition: var(--transition);
            display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
        }
        .media-dropzone:hover { border-color: var(--accent); background: rgba(0, 113, 227, 0.05); color: var(--accent); }
        .recording { border-color: var(--error) !important; color: var(--error) !important; animation: pulse-border 1.5s infinite; }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        /* Saved Media Gallery */
        .media-gallery {
            padding: 0 2rem 2rem 2rem;
            display: flex; gap: 1rem; overflow-x: auto;
        }
        .media-item {
            position: relative; width: 120px; height: 120px; flex-shrink: 0;
            border-radius: 12px; overflow: hidden; border: 1px solid var(--glass-border);
            background: #000; display: flex; align-items: center; justify-content: center;
        }
        .media-item video, .media-item audio { width: 100%; height: 100%; object-fit: cover; }
        .media-item audio { height: 40px; }
        .media-item .delete-btn {
            position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6);
            color: white; border: none; border-radius: 50%; width: 24px; height: 24px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 12px; padding: 0;
            z-index: 10;
        }

        .text-file-icon {
            width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #2c2c2e; color: #fff; cursor: pointer; transition: background 0.2s; text-align: center;
        }
        .text-file-icon:hover { background: var(--accent); }

        /* Floating PiP Recorder / Preview */
        .floating-preview {
            position: fixed; bottom: 2rem; right: 2rem; width: 320px; z-index: 1000;
            padding: 1rem; display: flex; flex-direction: column; gap: 1rem;
            transform: translateY(150%); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .floating-preview.active { transform: translateY(0); opacity: 1; }
        .floating-preview video { width: 100%; border-radius: 8px; background: #000; }
        .floating-preview audio { width: 100%; outline: none; }
        .floating-preview .controls { display: flex; gap: 0.5rem; justify-content: flex-end; }
        .hidden { display: none !important; }
        
        .pulse-indicator { display: flex; align-items: center; gap: 0.5rem; color: var(--error); font-weight: 500; font-size: 0.9rem;}
        .pulse-indicator .dot { background: var(--error); animation: pulse 1s infinite alternate; }

        /* Full Screen Modals (Archive & Text Preview) */
        .archive-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center;
            opacity: 1; transition: opacity 0.3s ease;
        }
        .archive-overlay.hidden { opacity: 0; pointer-events: none; }
        
        /* z-indexes to allow text preview to sit above the archive modal */
        #archiveModal { z-index: 2000; }
        #textPreviewModal { z-index: 3000; }
        
        .archive-container {
            width: 90%; max-width: 1000px; height: 85vh; display: flex; flex-direction: column;
            padding: 0; overflow: hidden;
        }
        .archive-header {
            padding: 1.5rem 2rem; border-bottom: 1px solid var(--glass-border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .archive-header h2 { font-size: 1.5rem; font-weight: 600; margin: 0; }
        .archive-content {
            flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 2.5rem;
        }
        .archive-date-block {
            border-bottom: 1px solid var(--glass-border); padding-bottom: 2rem;
        }
        .archive-date-block:last-child { border-bottom: none; padding-bottom: 0; }
        .archive-date-title {
            font-size: 1.2rem; font-weight: 700; color: var(--accent); margin-bottom: 1rem;
        }
        .archive-text-preview {
            color: var(--text-primary); font-size: 1.05rem; line-height: 1.6; white-space: pre-wrap; margin-bottom: 1.5rem;
        }
        .archive-media-grid { display: flex; gap: 1rem; flex-wrap: wrap; }
        .archive-media-grid .media-item { width: 240px; height: 180px; }
        .archive-media-grid .media-item audio { height: 50px; }
        .empty-archive { text-align: center; color: var(--text-secondary); margin-top: 3rem; }

        /* Text preview preformat styling */
        #textPreviewContent {
            font-family: var(--font-family);
            font-size: 1.1rem;
            line-height: 1.7;
            white-space: pre-wrap;
            color: var(--text-primary);
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; height: auto; }
            .main-content { height: 600px; }
            .media-drawer { grid-template-columns: 1fr; }
            .floating-preview { bottom: 1rem; right: 1rem; width: calc(100% - 2rem); }
            .archive-container { width: 95%; height: 90vh; }
            .archive-media-grid .media-item { width: 100%; height: 200px; }
        }
    </style>
</head>
<body>

    <div id="appContainer" class="container">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="glass header-card">
                <div id="greeting" class="greeting">Good Morning</div>
                <div id="currentDate" class="date-display">Date</div>
                <div id="currentTime" class="clock">00:00</div>
            </div>

            <div class="glass calendar-card">
                <div class="calendar-header">
                    <button onclick="changeMonth(-1)" title="Previous Month">&#8592;</button>
                    <span id="calendarMonthYear">Month Year</span>
                    <button onclick="changeMonth(1)" title="Next Month">&#8594;</button>
                </div>
                <div class="calendar-grid">
                    <div class="day-name">S</div><div class="day-name">M</div><div class="day-name">T</div>
                    <div class="day-name">W</div><div class="day-name">T</div><div class="day-name">F</div><div class="day-name">S</div>
                </div>
                <div id="calendarDays" class="calendar-grid"></div>
            </div>
            
            <div class="glass calendar-card" style="padding: 1rem;">
                <div style="font-size: 0.9rem; color: var(--text-secondary);">
                    <div>Storage Context: <span style="color:var(--text-primary)">Local IndexedDB</span></div>
                    <div style="margin-top: 0.5rem;">Timezone: <span id="tzDisplay" style="color:var(--text-primary)">UTC</span></div>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            <div class="glass toolbar">
                <div class="tools">
                    <button onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                        Theme
                    </button>
                    <button onclick="clearCurrentDay()" title="Clear today's entry">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        Clear Day
                    </button>
                </div>
                <div>
                    <button class="primary" onclick="openArchive()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 5px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        View All Files
                    </button>
                </div>
            </div>

            <div class="glass editor-card">
                <textarea id="journalEditor" placeholder="What's on your mind today?"></textarea>
                
                <!-- Media Gallery for Today -->
                <div id="mediaGallery" class="media-gallery hidden">
                    <!-- Thumbnails injected here -->
                </div>

                <div class="status-bar">
                    <div class="status-indicator">
                        <div id="syncDot" class="dot saved"></div>
                        <span id="syncText">Ready</span>
                    </div>
                    <div id="wordCount">0 words</div>
                </div>
            </div>

            <!-- Media Actions -->
            <div class="media-drawer">
                <div class="glass media-dropzone" onclick="exportToTxt()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    <span>Create .txt File</span>
                </div>
                <div class="glass media-dropzone" id="audioBtn" onclick="startRecording('audio')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    <span id="audioLabel">Record Audio</span>
                </div>
                <div class="glass media-dropzone" id="videoBtn" onclick="startRecording('video')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                    <span id="videoLabel">Record Video</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Floating Recording / Preview Window -->
    <div id="floatingPreview" class="glass floating-preview">
        <!-- Live Recording State -->
        <div id="liveState" class="hidden">
            <div class="pulse-indicator" style="margin-bottom: 0.5rem;"><div class="dot"></div> Recording Live</div>
            <video id="liveVideo" autoplay muted playsinline class="hidden"></video>
            <div id="liveAudioVis" class="hidden" style="height: 60px; background: rgba(0,0,0,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem;">Audio Recording Active</div>
            <div class="controls" style="margin-top: 1rem;">
                <button class="danger" onclick="stopRecording()" style="width: 100%; justify-content: center;">Stop Recording</button>
            </div>
        </div>

        <!-- Preview State -->
        <div id="previewState" class="hidden">
            <div style="margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem;">Review Recording</div>
            <video id="playbackVideo" controls class="hidden"></video>
            <audio id="playbackAudio" controls class="hidden"></audio>
            <div class="controls" style="margin-top: 1rem;">
                <button onclick="discardMedia()" style="background: rgba(128,128,128,0.2);">Discard</button>
                <button class="primary" onclick="saveMediaToDiary()">Save to Diary</button>
            </div>
        </div>
    </div>

    <!-- Full Screen Archive / Files View Modal -->
    <div id="archiveModal" class="archive-overlay hidden">
        <div class="glass archive-container">
            <div class="archive-header">
                <h2>Diary Archive</h2>
                <button onclick="closeArchive()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div id="archiveContent" class="archive-content">
                <!-- Date blocks dynamically injected here -->
            </div>
        </div>
    </div>

    <!-- Full Screen Text File Preview Modal -->
    <div id="textPreviewModal" class="archive-overlay hidden">
        <div class="glass archive-container" style="max-width: 800px;">
            <div class="archive-header">
                <h2 id="textPreviewTitle">Text Document</h2>
                <button onclick="closeTextPreview()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="archive-content" style="background: var(--bg-color); border-radius: 0 0 24px 24px;">
                <pre id="textPreviewContent">Loading preview...</pre>
            </div>
        </div>
    </div>

    <script>
        // --- Database (IndexedDB) Initialization ---
        const DB_NAME = "DiaryDB";
        const STORE_NAME = "entries";
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "date" });
                    }
                };
                request.onsuccess = (e) => { db = e.target.result; resolve(); };
                request.onerror = (e) => reject(e.target.error);
            });
        }

        // --- App State ---
        let currentActiveDate = new Date();
        let displayedMonth = new Date();
        let isDarkMode = false;
        let editorTimeout = null;
        let activeEntry = { date: '', text: '', media: [] }; 

        // --- Media State ---
        let mediaRecorder;
        let recordedChunks = [];
        let activeStream = null;
        let pendingMediaBlob = null;
        let pendingMediaType = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            initTimeAndDate();
            
            activeEntry.date = formatDateFolder(currentActiveDate);
            await loadContentForDate(currentActiveDate);
            initCalendar();
            setupEditor();

            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) toggleTheme();
        });

        // --- Clock & Date Header ---
        function initTimeAndDate() {
            document.getElementById('tzDisplay').innerText = Intl.DateTimeFormat().resolvedOptions().timeZone;
            setInterval(() => {
                const now = new Date();
                document.getElementById('currentTime').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                const hour = now.getHours();
                document.getElementById('greeting').innerText = hour < 12 ? 'Good Morning' : (hour < 18 ? 'Good Afternoon' : 'Good Evening');
            }, 1000);
            updateHeaderDate(currentActiveDate);
        }

        function updateHeaderDate(date) {
            document.getElementById('currentDate').innerText = date.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }

        function formatDateFolder(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        // --- IndexedDB Operations ---
        async function getEntryFromDB(dateStr) {
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(dateStr);
                req.onsuccess = () => resolve(req.result || { date: dateStr, text: '', media: [] });
            });
        }

        async function saveEntryToDB(entry) {
            return new Promise((resolve) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                const store = tx.objectStore(STORE_NAME);
                store.put(entry);
                tx.oncomplete = () => resolve();
            });
        }

        // --- UI & Editor Logic ---
        async function loadContentForDate(date) {
            const dateStr = formatDateFolder(date);
            activeEntry = await getEntryFromDB(dateStr);
            
            const editor = document.getElementById('journalEditor');
            editor.value = activeEntry.text || '';
            updateWordCount(editor.value);
            renderMediaGallery();
            setSyncStatus('Loaded from Diary', 'saved');
        }

        async function saveTextContent() {
            const editor = document.getElementById('journalEditor');
            activeEntry.text = editor.value;
            await saveEntryToDB(activeEntry);
            setSyncStatus('Saved to Diary', 'saved');
            renderCalendar(displayedMonth);
        }

        function setupEditor() {
            const editor = document.getElementById('journalEditor');
            editor.addEventListener('input', () => {
                updateWordCount(editor.value);
                setSyncStatus('Saving...', 'syncing');
                clearTimeout(editorTimeout);
                editorTimeout = setTimeout(saveTextContent, 1000);
            });
        }

        function updateWordCount(text) {
            document.getElementById('wordCount').innerText = `${text.trim() ? text.trim().split(/\s+/).length : 0} words`;
        }

        async function clearCurrentDay() {
            if (confirm("Clear all text and media for this day?")) {
                activeEntry = { date: activeEntry.date, text: '', media: [] };
                document.getElementById('journalEditor').value = '';
                updateWordCount('');
                await saveEntryToDB(activeEntry);
                renderMediaGallery();
                renderCalendar(displayedMonth);
                setSyncStatus('Entry cleared', 'saved');
            }
        }

        function setSyncStatus(message, state) {
            document.getElementById('syncText').innerText = message;
            document.getElementById('syncDot').className = `dot ${state}`;
        }

        // --- Create .TXT File logic (No immediate download) ---
        async function exportToTxt() {
            const text = document.getElementById('journalEditor').value;
            if (!text.trim()) {
                alert("You haven't written anything for this day yet.");
                return;
            }
            
            // Filter out any existing text files in media so we only have one up-to-date file per day
            activeEntry.media = activeEntry.media.filter(m => m.type !== 'text');
            
            const filename = `Diary_${activeEntry.date}.txt`;
            const blob = new Blob([text], { type: 'text/plain' });
            
            const mediaItem = {
                id: Date.now().toString(),
                type: 'text',
                blob: blob,
                filename: filename
            };
            
            activeEntry.media.push(mediaItem);
            await saveEntryToDB(activeEntry);
            
            renderMediaGallery();
            renderCalendar(displayedMonth);
            setSyncStatus('.txt file updated in gallery', 'saved');
        }

        // --- Text Preview Logic ---
        async function openTextPreview(url, filename) {
            document.getElementById('textPreviewModal').classList.remove('hidden');
            document.getElementById('textPreviewTitle').innerText = filename || 'Text Preview';
            document.getElementById('textPreviewContent').innerText = 'Loading text...';

            try {
                const response = await fetch(url);
                const text = await response.text();
                document.getElementById('textPreviewContent').innerText = text;
            } catch (err) {
                document.getElementById('textPreviewContent').innerText = 'Error loading text file preview.';
            }
        }

        function closeTextPreview() {
            document.getElementById('textPreviewModal').classList.add('hidden');
        }

        // --- Calendar Logic ---
        async function renderCalendar(date) {
            const year = date.getFullYear();
            const month = date.getMonth();
            document.getElementById('calendarMonthYear').innerText = date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            
            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';
            
            for (let i = 0; i < new Date(year, month, 1).getDay(); i++) calendarDays.appendChild(document.createElement('div'));
            
            const tx = db.transaction(STORE_NAME, "readonly");
            const store = tx.objectStore(STORE_NAME);
            const allReq = store.getAll();
            
            allReq.onsuccess = () => {
                const allEntries = allReq.result;
                const activeSet = new Set(allEntries.filter(e => e.text.trim() !== '' || e.media.length > 0).map(e => e.date));
                
                for (let i = 1; i <= new Date(year, month + 1, 0).getDate(); i++) {
                    const cellDate = new Date(year, month, i);
                    const dayDiv = document.createElement('div');
                    dayDiv.classList.add('calendar-day');
                    dayDiv.innerText = i;
                    
                    if (cellDate.toDateString() === currentActiveDate.toDateString()) dayDiv.classList.add('today');
                    
                    if (activeSet.has(formatDateFolder(cellDate))) {
                        dayDiv.style.position = 'relative';
                        dayDiv.classList.add('has-entry');
                    }
                    dayDiv.onclick = async () => {
                        currentActiveDate = cellDate;
                        updateHeaderDate(cellDate);
                        await loadContentForDate(cellDate);
                        renderCalendar(displayedMonth);
                    };
                    calendarDays.appendChild(dayDiv);
                }
            };
        }

        function changeMonth(offset) {
            displayedMonth.setMonth(displayedMonth.getMonth() + offset);
            renderCalendar(displayedMonth);
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
        }

        // --- Media Recording & Preview Logic ---
        async function startRecording(type) {
            const floating = document.getElementById('floatingPreview');
            const liveState = document.getElementById('liveState');
            const previewState = document.getElementById('previewState');
            const liveVideo = document.getElementById('liveVideo');
            const liveAudioVis = document.getElementById('liveAudioVis');
            
            pendingMediaType = type;
            recordedChunks = [];
            
            try {
                activeStream = await navigator.mediaDevices.getUserMedia({ 
                    video: type === 'video', 
                    audio: true 
                });
                
                floating.classList.add('active');
                liveState.classList.remove('hidden');
                previewState.classList.add('hidden');
                
                if (type === 'video') {
                    liveVideo.srcObject = activeStream;
                    liveVideo.classList.remove('hidden');
                    liveAudioVis.classList.add('hidden');
                } else {
                    liveVideo.classList.add('hidden');
                    liveAudioVis.classList.remove('hidden');
                }

                mediaRecorder = new MediaRecorder(activeStream);
                mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = showPreview;
                mediaRecorder.start();
                
            } catch (err) {
                alert("Microphone/Camera access denied.");
                floating.classList.remove('active');
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
            }
        }

        function showPreview() {
            document.getElementById('liveState').classList.add('hidden');
            document.getElementById('previewState').classList.remove('hidden');
            
            pendingMediaBlob = new Blob(recordedChunks, { type: pendingMediaType === 'video' ? 'video/webm' : 'audio/webm' });
            const url = URL.createObjectURL(pendingMediaBlob);
            
            const pVideo = document.getElementById('playbackVideo');
            const pAudio = document.getElementById('playbackAudio');
            
            if (pendingMediaType === 'video') {
                pVideo.src = url;
                pVideo.classList.remove('hidden');
                pAudio.classList.add('hidden');
            } else {
                pAudio.src = url;
                pAudio.classList.remove('hidden');
                pVideo.classList.add('hidden');
            }
        }

        function discardMedia() {
            pendingMediaBlob = null;
            document.getElementById('floatingPreview').classList.remove('active');
            document.getElementById('playbackVideo').src = '';
            document.getElementById('playbackAudio').src = '';
        }

        async function saveMediaToDiary() {
            if (!pendingMediaBlob) return;
            
            const mediaItem = {
                id: Date.now().toString(),
                type: pendingMediaType,
                blob: pendingMediaBlob
            };
            
            activeEntry.media.push(mediaItem);
            await saveEntryToDB(activeEntry);
            
            discardMedia(); // Closes PiP window
            renderMediaGallery();
            renderCalendar(displayedMonth);
            setSyncStatus('Media saved to Diary', 'saved');
        }

        // --- Media Gallery ---
        function renderMediaGallery() {
            const gallery = document.getElementById('mediaGallery');
            gallery.innerHTML = '';
            
            if (!activeEntry.media || activeEntry.media.length === 0) {
                gallery.classList.add('hidden');
                return;
            }
            
            gallery.classList.remove('hidden');
            
            activeEntry.media.forEach(item => {
                const wrap = document.createElement('div');
                wrap.className = 'media-item';
                
                const url = URL.createObjectURL(item.blob);
                
                if (item.type === 'video') {
                    const vid = document.createElement('video');
                    vid.src = url; vid.controls = true;
                    wrap.appendChild(vid);
                } else if (item.type === 'audio') {
                    const aud = document.createElement('audio');
                    aud.src = url; aud.controls = true;
                    wrap.appendChild(aud);
                } else if (item.type === 'text') {
                    const textIcon = document.createElement('div');
                    textIcon.className = 'text-file-icon';
                    textIcon.title = "Click to preview";
                    textIcon.innerHTML = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg><span style="font-size:0.75rem; margin-top:8px; font-weight:600;">PREVIEW TXT</span>`;
                    
                    // Click opens preview instead of download
                    textIcon.onclick = () => openTextPreview(url, item.filename || `Diary_${activeEntry.date}.txt`);
                    
                    wrap.appendChild(textIcon);
                }
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '×';
                delBtn.onclick = async () => {
                    activeEntry.media = activeEntry.media.filter(m => m.id !== item.id);
                    await saveEntryToDB(activeEntry);
                    renderMediaGallery();
                    renderCalendar(displayedMonth);
                };
                wrap.appendChild(delBtn);
                gallery.appendChild(wrap);
            });
        }

        // --- Archive / File Viewer Logic ---
        function openArchive() {
            document.getElementById('archiveModal').classList.remove('hidden');
            loadArchiveData();
        }

        function closeArchive() {
            document.getElementById('archiveModal').classList.add('hidden');
            document.getElementById('archiveContent').innerHTML = ''; // free memory of Object URLs
        }

        function loadArchiveData() {
            const content = document.getElementById('archiveContent');
            content.innerHTML = '<div class="empty-archive">Loading your diary archive...</div>';
            
            const tx = db.transaction(STORE_NAME, "readonly");
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAll();
            
            req.onsuccess = () => {
                let entries = req.result;
                
                // Filter out empty days
                entries = entries.filter(e => e.text.trim() !== '' || (e.media && e.media.length > 0));
                
                // Sort by date (Newest first)
                entries.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                if (entries.length === 0) {
                    content.innerHTML = '<div class="empty-archive">Your archive is empty. Start writing or recording to see your files here!</div>';
                    return;
                }
                
                content.innerHTML = ''; // Clear loading
                
                entries.forEach(entry => {
                    const block = document.createElement('div');
                    block.className = 'archive-date-block';
                    
                    // Format Date nicely
                    const [year, month, day] = entry.date.split('-');
                    const dateObj = new Date(year, month - 1, day);
                    const formattedDate = dateObj.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                    
                    let html = `<div class="archive-date-title">${formattedDate}</div>`;
                    
                    if (entry.text) {
                        html += `<div class="archive-text-preview">${entry.text}</div>`;
                    }
                    
                    block.innerHTML = html;
                    
                    // Add Media if it exists
                    if (entry.media && entry.media.length > 0) {
                        const mediaGrid = document.createElement('div');
                        mediaGrid.className = 'archive-media-grid';
                        
                        entry.media.forEach(m => {
                            const mWrap = document.createElement('div');
                            mWrap.className = 'media-item';
                            const url = URL.createObjectURL(m.blob);
                            
                            if (m.type === 'video') {
                                mWrap.innerHTML = `<video src="${url}" controls preload="metadata"></video>`;
                            } else if (m.type === 'audio') {
                                mWrap.innerHTML = `<audio src="${url}" controls preload="metadata"></audio>`;
                            } else if (m.type === 'text') {
                                mWrap.innerHTML = `
                                <div class="text-file-icon" onclick="openTextPreview('${url}', '${m.filename || 'diary.txt'}')">
                                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom:12px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                    <span style="font-size: 1rem; font-weight: 600;">Preview .TXT</span>
                                </div>`;
                            }
                            mediaGrid.appendChild(mWrap);
                        });
                        block.appendChild(mediaGrid);
                    }
                    
                    content.appendChild(block);
                });
            };
        }
    </script>
