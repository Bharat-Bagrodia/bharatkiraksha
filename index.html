<!DOCTYPE html>
<html lang="en" data-theme="astronaut">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Diary">
    <meta name="theme-color" content="#0b1020">
    <title>Bharat Kiraksha - Astro Diary</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* --- Astronaut theme variables --- */
        :root {
            --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            --font-astro: 'Orbitron', var(--font-sans);
            --bg-color: #050617; /* deep space */
            --bg-mesh: radial-gradient(circle at 10% 10%, rgba(123,97,255,0.06) 0, transparent 20%),
                       radial-gradient(circle at 80% 20%, rgba(127,255,212,0.04) 0, transparent 20%),
                       radial-gradient(circle at 30% 80%, rgba(255,255,255,0.02) 0, transparent 30%);
            --star-field: radial-gradient(circle at 40% 10%, rgba(255,255,255,0.03) 0, transparent 2px),
                         radial-gradient(circle at 70% 30%, rgba(255,255,255,0.02) 0, transparent 1px);
            --glass-bg: rgba(8,12,25,0.6);
            --glass-border: rgba(255,255,255,0.04);
            --glass-shadow: 0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
            --accent-a: #7b61ff; /* violet */
            --accent-b: #7fffd4; /* aquamarine */
            --accent: linear-gradient(90deg,var(--accent-a),var(--accent-b));
            --accent-solid: #7b61ff;
            --text-primary: #e6eef8;
            --text-secondary: #9fb0c9;
            --success: #34c759;
            --error: #ff6b6b;
            --radius-lg: 18px;
            --radius-md: 12px;
            --transition: all 0.24s cubic-bezier(.2,.9,.2,1);
            --safe-area-top: max(0px, env(safe-area-inset-top));
            --safe-area-bottom: max(0px, env(safe-area-inset-bottom));
        }

        [data-theme="light"] {
            --bg-color: #f5f7fb;
            --glass-bg: rgba(255,255,255,0.85);
            --glass-border: rgba(0,0,0,0.06);
            --text-primary: #111827;
            --text-secondary: #4b5563;
        }

        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%;}
        body{
            font-family:var(--font-sans);
            background-color:var(--bg-color);
            background-image: var(--bg-mesh), var(--star-field);
            color:var(--text-primary);
            min-height:100vh;
            display:flex;
            flex-direction:column;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }

        /* Top privacy banner */
        .privacy-banner{
            padding:0.6rem 1rem 0.8rem;
            background: linear-gradient(90deg,var(--accent-a), #184078);
            color:white;
            font-weight:600;
            text-align:center;
            padding-top:calc(0.6rem + var(--safe-area-top));
        }

        .container{
            width:100%;
            max-width:1200px;
            margin:1.25rem auto;
            padding:1rem;
            display:grid;
            grid-template-columns:320px 1fr;
            gap:1rem;
            align-items:start;
        }

        /* Fix: allow main column to scroll and avoid 100vh calc overflows */
        main{height:calc(100vh - 140px); overflow:auto}

        .glass{
            background:var(--glass-bg);
            border-radius:var(--radius-lg);
            border:1px solid var(--glass-border);
            box-shadow:var(--glass-shadow);
            padding:1rem;
        }

        /* Sidebar */
        .sidebar{display:flex;flex-direction:column;gap:0.9rem}
        .header-card{text-align:center;padding:1.25rem}
        .greeting{font-family:var(--font-astro);letter-spacing:0.6px;color:var(--accent-b);font-weight:700}
        .date-display{font-size:1.05rem;margin-top:0.35rem;color:var(--text-secondary)}
        .clock{font-family:var(--font-astro);font-size:2rem;margin-top:0.5rem}

        .stats-card{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem}
        .stat-item{padding:0.6rem;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);}
        .stat-label{font-size:0.75rem;color:var(--text-secondary);text-transform:uppercase}
        .stat-value{font-weight:700;color:var(--accent-b);font-size:1.1rem}

        /* Calendar */
        .calendar-card{padding:1rem}
        .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0.4rem}
        .calendar-day{aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
        .calendar-day.today{background:var(--accent-b);color:#041018}
        .calendar-day.has-entry::after{content:'';position:absolute;bottom:8%;width:6px;height:6px;background:var(--accent-a);border-radius:50%}

        /* Main workspace */
        .toolbar{display:flex;justify-content:space-between;gap:0.5rem;align-items:center}
        .toolbar button{background:transparent;border:1px solid transparent;padding:0.5rem 0.8rem;border-radius:8px;color:var(--text-primary);cursor:pointer}
        .toolbar .primary{background:var(--accent-solid);color:white}

        .editor-card{display:flex;flex-direction:column;height:100%;overflow:hidden}
        textarea{flex:1;width:100%;border:none;background:transparent;padding:1.25rem;font-size:1rem;color:var(--text-primary);outline:none;resize:none}
        .status-bar{display:flex;justify-content:space-between;padding:0.6rem 1rem;border-top:1px solid rgba(255,255,255,0.03);color:var(--text-secondary)}

        /* Media drawer */
        .media-drawer{display:grid;grid-template-columns:repeat(4,1fr);gap:0.7rem;margin-top:0.75rem}
        .media-dropzone{border:1px dashed rgba(255,255,255,0.06);padding:0.8rem;border-radius:10px;text-align:center;cursor:pointer;background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent)}

        .media-gallery{display:flex;gap:0.75rem;padding:0.75rem;overflow:auto}
        .media-item{position:relative;width:140px;height:100px;border-radius:10px;overflow:hidden;background:#021224;border:1px solid rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center}
        .media-item video,.media-item audio{width:100%;height:100%;object-fit:cover}
        .media-item .play-overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.45);padding:6px;border-radius:50%;display:flex;align-items:center;justify-content:center}
        .media-item .delete-btn{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.45);border:none;color:white;width:28px;height:28px;border-radius:6px;cursor:pointer}

        .floating-preview{position:fixed;right:1rem;bottom:1rem;width:360px;z-index:2000;padding:0.6rem;border-radius:12px}

        /* responsive */
        @media(max-width:900px){
            .container{grid-template-columns:1fr;}
            main{height:auto}
            .media-drawer{grid-template-columns:repeat(2,1fr)}
        }

    </style>
</head>
<body>
    <div class="privacy-banner">🔭 Astro Diary — private log of your star-days. Data stays in your browser.</div>

    <div class="container" id="appContainer">
        <aside class="sidebar">
            <div class="glass header-card">
                <div id="greeting" class="greeting">Good Stellar Morning</div>
                <div id="currentDate" class="date-display">Loading date...</div>
                <div id="currentTime" class="clock">00:00</div>
            </div>

            <div class="glass stats-card">
                <div class="stat-item">
                    <div class="stat-label">Total Entries</div>
                    <div class="stat-value" id="totalEntries">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Total Media</div>
                    <div class="stat-value" id="totalMedia">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Today Words</div>
                    <div class="stat-value" id="todayWords">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Streak Days</div>
                    <div class="stat-value" id="streakDays">0</div>
                </div>
            </div>

            <div class="glass calendar-card">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem">
                    <button onclick="changeMonth(-1)">◀</button>
                    <div id="calendarMonthYear" style="font-weight:700"></div>
                    <button onclick="changeMonth(1)">▶</button>
                </div>
                <div class="calendar-grid" id="calendarDays"></div>
            </div>
        </aside>

        <main>
            <div class="glass toolbar" style="margin-bottom:0.6rem">
                <div style="display:flex;gap:0.5rem;align-items:center">
                    <button onclick="toggleTheme()">Theme</button>
                    <button onclick="clearCurrentDay()">Clear</button>
                </div>
                <div>
                    <button class="primary" onclick="openArchive()">Archive</button>
                </div>
            </div>

            <div class="glass editor-card">
                <textarea id="journalEditor" placeholder="Log your star-journey..." ></textarea>
                <div id="mediaGallery" class="media-gallery" aria-live="polite"></div>
                <div class="status-bar">
                    <div><span id="syncText">Ready</span></div>
                    <div id="wordCount">0 words</div>
                </div>
            </div>

            <div style="margin-top:0.6rem" class="media-drawer">
                <div class="glass media-dropzone" onclick="exportToTxt()">📝 Text</div>
                <div class="glass media-dropzone" id="uploadAudio">🎙️ Upload Audio<input id="fileAudioInput" type="file" accept="audio/*" style="display:none"></div>
                <div class="glass media-dropzone" id="uploadVideo">🎥 Upload Video<input id="fileVideoInput" type="file" accept="video/*" style="display:none"></div>
                <div class="glass media-dropzone" id="importBackup">📥 Import</div>
            </div>
        </main>
    </div>

    <!-- Floating preview (used for recordings or playing larger previews) -->
    <div id="floatingPreview" class="glass floating-preview hidden" style="display:none">
        <div id="floatingContent"></div>
        <div style="display:flex;gap:0.5rem;justify-content:flex-end;margin-top:0.5rem">
            <button onclick="closeFloating()">Close</button>
        </div>
    </div>

    <script>
        // -- DB setup (keeps original keys for backward compatibility) --
        const DB_NAME = 'DiaryDB';
        const STORE_NAME = 'entries';
        let db;

        function initDB(){
            return new Promise((resolve,reject)=>{
                const req = indexedDB.open(DB_NAME,1);
                req.onupgradeneeded = e => {
                    db = e.target.result;
                    if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME,{keyPath:'date'});
                };
                req.onsuccess = e=>{db=e.target.result;resolve()};
                req.onerror = e=>reject(e);
            });
        }

        // -- App state --
        let currentActiveDate = new Date();
        let displayedMonth = new Date();
        let activeEntry = {date:'',text:'',media:[]};

        function formatDateFolder(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

        async function getEntryFromDB(dateStr){
            return new Promise(resolve=>{
                const tx = db.transaction(STORE_NAME,'readonly');
                const store = tx.objectStore(STORE_NAME);
                const r = store.get(dateStr);
                r.onsuccess = ()=> resolve(r.result || {date:dateStr,text:'',media:[]});
            });
        }
        async function saveEntryToDB(entry){
            return new Promise(resolve=>{
                const tx = db.transaction(STORE_NAME,'readwrite');
                tx.objectStore(STORE_NAME).put(entry);
                tx.oncomplete = ()=>resolve();
            });
        }
        async function getAllEntries(){
            return new Promise(resolve=>{
                const tx = db.transaction(STORE_NAME,'readonly');
                const r = tx.objectStore(STORE_NAME).getAll();
                r.onsuccess = ()=>resolve(r.result||[]);
            });
        }

        // -- UI init --
        document.addEventListener('DOMContentLoaded',async ()=>{
            await initDB();
            initTime();
            activeEntry.date = formatDateFolder(currentActiveDate);
            await loadContentForDate(currentActiveDate);
            renderCalendar(displayedMonth);
            setupEditor();
            wireFileInputs();
            updateStats();
        });

        function initTime(){
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            setInterval(()=>{
                const now = new Date();
                document.getElementById('currentTime').innerText = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
                document.getElementById('greeting').innerText = now.getHours()<12? 'Good Morning':'Good Evening';
                document.getElementById('currentDate').innerText = now.toLocaleDateString([], {weekday:'long',day:'numeric',month:'long',year:'numeric'});
            },1000);
        }

        async function loadContentForDate(date){
            const ds = formatDateFolder(date);
            activeEntry = await getEntryFromDB(ds);
            document.getElementById('journalEditor').value = activeEntry.text||'';
            updateWordCount(activeEntry.text||'');
            renderMediaGallery();
            setSyncStatus('Loaded');
        }

        function setupEditor(){
            const editor = document.getElementById('journalEditor');
            let t;
            editor.addEventListener('input', ()=>{
                updateWordCount(editor.value);
                setSyncStatus('Saving...');
                clearTimeout(t);
                t = setTimeout(async ()=>{ activeEntry.text = editor.value; await saveEntryToDB(activeEntry); setSyncStatus('Saved'); renderCalendar(displayedMonth); updateStats(); }, 700);
            });
        }

        function updateWordCount(text){
            const count = text.trim()? text.trim().split(/\s+/).length : 0;
            document.getElementById('wordCount').innerText = `${count} words`;
            document.getElementById('todayWords').innerText = count;
        }

        function setSyncStatus(msg){ document.getElementById('syncText').innerText = msg }

        async function updateStats(){
            const all = await getAllEntries();
            const withContent = all.filter(e=> (e.text && e.text.trim()) || (e.media && e.media.length>0));
            let totalMedia = 0; withContent.forEach(e=>{ if(e.media) totalMedia += e.media.length });
            document.getElementById('totalEntries').innerText = withContent.length;
            document.getElementById('totalMedia').innerText = totalMedia;
            // simple streak
            let streak=0; const today=new Date(); for(let i=0;i<365;i++){ const c=new Date(today); c.setDate(c.getDate()-i); const d=formatDateFolder(c); const ent = all.find(x=>x.date===d); if(ent && ((ent.text||'').trim()|| (ent.media&&ent.media.length))) streak++; else if(i>0) break }
            document.getElementById('streakDays').innerText = streak;
        }

        async function clearCurrentDay(){ if(confirm('Clear today?')){ activeEntry.text=''; activeEntry.media=[]; document.getElementById('journalEditor').value=''; await saveEntryToDB(activeEntry); renderMediaGallery(); renderCalendar(displayedMonth); updateStats(); setSyncStatus('Cleared') } }

        // --- Export text as .txt and add as media item (keeps backward compatibility) ---
        async function exportToTxt(){
            const text = document.getElementById('journalEditor').value;
            if(!text.trim()){ alert('Nothing to export'); return }
            const blob = new Blob([text],{type:'text/plain'});
            const item = { id:Date.now().toString(), type:'text', filename:`Diary_${activeEntry.date}.txt`, blob, timestamp:new Date().toISOString() };
            activeEntry.media = activeEntry.media || [];
            activeEntry.media.push(item);
            await saveEntryToDB(activeEntry);
            renderMediaGallery(); updateStats(); setSyncStatus('Exported');
        }

        // --- Media gallery rendering with inline play option ---
        function renderMediaGallery(){
            const gallery = document.getElementById('mediaGallery');
            gallery.innerHTML = '';
            const media = (activeEntry.media||[]);
            if(media.length===0){ gallery.innerHTML = '<div style="color:var(--text-secondary);padding:0.6rem">No media for this day</div>'; return }

            media.forEach((m, idx)=>{
                const div = document.createElement('div'); div.className='media-item';
                // delete button
                const del = document.createElement('button'); del.className='delete-btn'; del.innerText='✕'; del.title='Delete'; del.onclick = async (e)=>{ e.stopPropagation(); media.splice(idx,1); activeEntry.media = media; await saveEntryToDB(activeEntry); renderMediaGallery(); updateStats(); };
                div.appendChild(del);

                if(m.type==='audio'){
                    const audio = document.createElement('audio'); audio.controls=true;
                    let url = m.blob ? URL.createObjectURL(m.blob) : (m.url||''); audio.src = url;
                    audio.style.height='100%'; div.appendChild(audio);
                } else if(m.type==='video'){
                    const video = document.createElement('video'); video.controls=true; video.style.width='100%'; video.style.height='100%';
                    let url = m.blob ? URL.createObjectURL(m.blob) : (m.url||''); video.src = url; div.appendChild(video);
                } else if(m.type==='text'){
                    const box = document.createElement('div'); box.className='text-file-icon'; box.innerText = m.filename || 'document.txt'; box.onclick = ()=>{ if(m.blob) openTextBlob(m.blob, m.filename); else if(m.url) openTextUrl(m.url,m.filename); };
                    div.appendChild(box);
                } else if(m.type==='image'){
                    const img = document.createElement('img'); img.src = m.blob? URL.createObjectURL(m.blob) : (m.url||''); img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; div.appendChild(img);
                } else {
                    // fallback: try url or blob
                    if(m.blob && m.blob.type && m.blob.type.startsWith('audio')){
                        const audio = document.createElement('audio'); audio.controls=true; audio.src = URL.createObjectURL(m.blob); div.appendChild(audio);
                    } else if(m.blob && m.blob.type && m.blob.type.startsWith('video')){
                        const video = document.createElement('video'); video.controls=true; video.src = URL.createObjectURL(m.blob); video.style.width='100%'; video.style.height='100%'; div.appendChild(video);
                    } else {
                        const u = document.createElement('div'); u.style.padding='0.6rem'; u.innerText = m.filename|| m.id || 'file'; div.appendChild(u);
                    }
                }

                // clicking a thumbnail opens floating preview with larger controls
                div.onclick = (e)=>{ // if clicked on controls (e.g., play), don't open
                    // if target is control element, ignore
                    const tag = e.target.tagName.toLowerCase();
                    if(tag==='button' || tag==='audio' || tag==='video' || tag==='input') return;
                    openFloatingPreview(m);
                };

                gallery.appendChild(div);
            });
        }

        function openTextBlob(blob, filename){
            const reader = new FileReader();
            reader.onload = ()=>{ openFloatingText(reader.result, filename) };
            reader.readAsText(blob);
        }
        function openTextUrl(url, filename){ fetch(url).then(r=>r.text()).then(t=>openFloatingText(t,filename)).catch(()=>alert('Could not load')) }
        function openFloatingText(text, title){ const fp=document.getElementById('floatingPreview'); fp.style.display='block'; fp.querySelector('#floatingContent').innerHTML = `<div style="font-family:monospace;white-space:pre-wrap;max-height:50vh;overflow:auto;color:var(--text-primary)"><strong>${title||''}</strong><pre style='white-space:pre-wrap'>${escapeHtml(text)}</pre></div>`; }

        function openFloatingPreview(m){ const fp=document.getElementById('floatingPreview'); const content = document.getElementById('floatingContent'); fp.style.display='block'; content.innerHTML='';
            if(m.type==='audio'){
                const a = document.createElement('audio'); a.controls=true; a.src = m.blob? URL.createObjectURL(m.blob): (m.url||''); a.style.width='100%'; content.appendChild(a); a.play().catch(()=>{});
            } else if(m.type==='video'){
                const v = document.createElement('video'); v.controls=true; v.src = m.blob? URL.createObjectURL(m.blob): (m.url||''); v.style.width='100%'; content.appendChild(v); v.play().catch(()=>{});
            } else if(m.type==='image'){
                const img = document.createElement('img'); img.src = m.blob? URL.createObjectURL(m.blob): (m.url||''); img.style.width='100%'; content.appendChild(img);
            } else if(m.type==='text'){
                if(m.blob) openTextBlob(m.blob,m.filename); else if(m.url) openTextUrl(m.url,m.filename);
            } else {
                content.innerText = 'Preview not available';
            }
        }

        function closeFloating(){ document.getElementById('floatingPreview').style.display='none'; document.getElementById('floatingContent').innerHTML=''; }
        function escapeHtml(s){ return (s+'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

        // --- Calendar rendering (simple) ---
        async function renderCalendar(date){
            const days = document.getElementById('calendarDays'); days.innerHTML='';
            const year = date.getFullYear(), month = date.getMonth();
            const firstDay = new Date(year,month,1).getDay();
            const daysInMonth = new Date(year,month+1,0).getDate();
            // add blanks
            for(let i=0;i<firstDay;i++){ const d=document.createElement('div'); d.style.visibility='hidden'; days.appendChild(d) }
            const all = await getAllEntries(); const activeSet = new Set(all.filter(e=> (e.text||'').trim() || (e.media&&e.media.length)).map(e=>e.date));
            for(let d=1;d<=daysInMonth;d++){
                const cd = new Date(year,month,d); const ds = formatDateFolder(cd);
                const el = document.createElement('div'); el.className='calendar-day'; el.innerText=d;
                if(ds===formatDateFolder(currentActiveDate)) el.classList.add('today');
                if(activeSet.has(ds)) el.classList.add('has-entry');
                el.onclick = async ()=>{ currentActiveDate = cd; await loadContentForDate(cd); };
                days.appendChild(el);
            }
            document.getElementById('calendarMonthYear').innerText = date.toLocaleDateString([], {month:'long',year:'numeric'});
        }
        function changeMonth(offset){ displayedMonth.setMonth(displayedMonth.getMonth()+offset); renderCalendar(displayedMonth) }

        // --- File uploads for media with inline play option ---
        function wireFileInputs(){
            const audioBtn = document.getElementById('uploadAudio');
            const audioInput = document.getElementById('fileAudioInput');
            audioBtn.addEventListener('click', ()=> audioInput.click());
            audioInput.addEventListener('change', async (e)=>{
                const f = e.target.files[0]; if(!f) return; const blob = f; const item = { id:Date.now().toString(), type:'audio', filename:f.name, blob, timestamp:new Date().toISOString() };
                activeEntry.media = activeEntry.media||[]; activeEntry.media.push(item); await saveEntryToDB(activeEntry); renderMediaGallery(); updateStats(); setSyncStatus('Audio uploaded');
                audioInput.value='';
            });

            const vidBtn = document.getElementById('uploadVideo');
            const vidInput = document.getElementById('fileVideoInput');
            vidBtn.addEventListener('click', ()=> vidInput.click());
            vidInput.addEventListener('change', async (e)=>{
                const f = e.target.files[0]; if(!f) return; const item = { id:Date.now().toString(), type:'video', filename:f.name, blob:f, timestamp:new Date().toISOString() };
                activeEntry.media = activeEntry.media||[]; activeEntry.media.push(item); await saveEntryToDB(activeEntry); renderMediaGallery(); updateStats(); setSyncStatus('Video uploaded');
                vidInput.value='';
            });

            document.getElementById('importBackup').addEventListener('click', ()=>{ alert('Import not implemented in this quick fix — please use backup upload in next release.'); });
        }

        // --- Archive modal simple placeholders ---
        function openArchive(){ alert('Archive: open modal (not fully implemented in this patch)') }

    </script>
</body>
</html>
